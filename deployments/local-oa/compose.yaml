name: ${LOCAL_OA_COMPOSE_PROJECT:-omsbizfoundry-local-oa}

# Local business-architecture validation only. There is deliberately no Nginx,
# Gateway or central IAM in this composition. Every application still authenticates
# through its supported local/template provider and owns a separate database.
services:
  contract-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: contract_ledger
      POSTGRES_USER: contract_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/local-oa init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U contract_ledger -d contract_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [contract-db:/var/lib/postgresql]
    networks: [contract-data]

  contract-ledger:
    image: ${LOCAL_OA_CONTRACT_IMAGE:-omsbizfoundry-local-oa-contract-ledger:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: contract-ledger}
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://contract_ledger:${POSTGRES_PASSWORD}@contract-db:5432/contract_ledger?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: local
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 本地 OA 演示管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?run ./ops/local-oa init}
      REFERENCE_TENANT_ID: ${TENANT_ID:?run ./ops/local-oa init}
      REFERENCE_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN:?run ./ops/local-oa init}
      EVIDENCE_STORAGE_DIR: /data/contract-evidence
    depends_on:
      contract-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${CONTRACT_HOST_PORT:-18081}:8081"]
    volumes: [contract-evidence:/data/contract-evidence]
    networks: [contract-data, app]

  money-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: money_flow
      POSTGRES_USER: money_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U money_flow -d money_flow"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [money-db:/var/lib/postgresql]
    networks: [money-data]

  money-flow-ledger:
    image: ${LOCAL_OA_MONEY_IMAGE:-omsbizfoundry-local-oa-money-flow-ledger:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: money-flow-ledger}
    environment:
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://money_flow:${POSTGRES_PASSWORD}@money-db:5432/money_flow?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: local
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 本地 OA 演示管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      REFERENCE_TENANT_ID: ${TENANT_ID}
      REFERENCE_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN}
    depends_on:
      money-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${MONEY_HOST_PORT:-18083}:8083"]
    networks: [money-data, app]

  people-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: people_groups
      POSTGRES_USER: people_groups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U people_groups -d people_groups"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [people-db:/var/lib/postgresql]
    networks: [people-data]

  people-groups:
    image: ${LOCAL_OA_PEOPLE_IMAGE:-omsbizfoundry-local-oa-people-groups:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: people-groups}
    environment:
      HTTP_ADDR: :8084
      DATABASE_URL: postgres://people_groups:${POSTGRES_PASSWORD}@people-db:5432/people_groups?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: ${TENANT_ID}
      TEMPLATE_SUBJECT_ID: ${TEMPLATE_SUBJECT_ID}
      TEMPLATE_DISPLAY_NAME: 本地 OA 演示管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      people-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${PEOPLE_HOST_PORT:-18084}:8084"]
    networks: [people-data, app]

  evidence-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: evidence_service
      POSTGRES_USER: evidence_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U evidence_service -d evidence_service"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [evidence-db:/var/lib/postgresql]
    networks: [evidence-data]

  evidence-service:
    image: ${LOCAL_OA_EVIDENCE_IMAGE:-omsbizfoundry-local-oa-evidence-service:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: evidence-service}
    environment:
      HTTP_ADDR: :8085
      DATABASE_URL: postgres://evidence_service:${POSTGRES_PASSWORD}@evidence-db:5432/evidence_service?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: ${TENANT_ID}
      TEMPLATE_SUBJECT_ID: ${TEMPLATE_SUBJECT_ID}
      TEMPLATE_DISPLAY_NAME: 本地 OA 演示管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      STORAGE_PROVIDER: local
      PUBLIC_BASE_URL: ${EVIDENCE_PUBLIC_BASE_URL:-http://127.0.0.1:${EVIDENCE_HOST_PORT:-18085}}
      LOCAL_STORAGE_ROOT: /data/evidence
      LOCAL_SIGNING_KEY: ${LOCAL_SIGNING_KEY}
    depends_on:
      evidence-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${EVIDENCE_HOST_PORT:-18085}:8085"]
    volumes: [evidence-files:/data/evidence]
    networks: [evidence-data, app]

  project-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: project_workspace
      POSTGRES_USER: project_workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U project_workspace -d project_workspace"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [project-db:/var/lib/postgresql]
    networks: [project-data]

  project-workspace:
    image: ${LOCAL_OA_PROJECT_IMAGE:-omsbizfoundry-local-oa-project-workspace:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: project-workspace}
    environment:
      HTTP_ADDR: :8086
      DATABASE_URL: postgres://project_workspace:${POSTGRES_PASSWORD}@project-db:5432/project_workspace?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: ${TENANT_ID}
      TEMPLATE_SUBJECT_ID: ${TEMPLATE_SUBJECT_ID}
      TEMPLATE_DISPLAY_NAME: 本地 OA 演示管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      PEOPLE_BASE_URL: http://people-groups:8084
      PEOPLE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      CONTRACT_BASE_URL: http://contract-ledger:8081
      CONTRACT_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN}
      MONEY_BASE_URL: http://money-flow-ledger:8083
      MONEY_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN}
      EVIDENCE_BASE_URL: http://evidence-service:8085
      EVIDENCE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      DESIGN_BASE_URL: http://design-operations:8087
      DESIGN_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
    depends_on:
      project-db: {condition: service_healthy}
      people-groups: {condition: service_healthy}
      contract-ledger: {condition: service_healthy}
      money-flow-ledger: {condition: service_healthy}
      evidence-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8086/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${PROJECT_HOST_PORT:-18086}:8086"]
    networks: [project-data, app]

  design-db:
    image: ${LOCAL_OA_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: design_operations
      POSTGRES_USER: design_operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U design_operations -d design_operations"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [design-db:/var/lib/postgresql]
    networks: [design-data]

  design-operations:
    image: ${LOCAL_OA_DESIGN_IMAGE:-omsbizfoundry-local-oa-design-operations:dev}
    build:
      context: ../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: design-operations}
    environment:
      HTTP_ADDR: :8087
      DATABASE_URL: postgres://design_operations:${POSTGRES_PASSWORD}@design-db:5432/design_operations?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: ${TENANT_ID}
      TEMPLATE_SUBJECT_ID: ${TEMPLATE_SUBJECT_ID}
      TEMPLATE_DISPLAY_NAME: 本地 OA 演示管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      PROJECT_BASE_URL: http://project-workspace:8086
      PROJECT_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      PEOPLE_BASE_URL: http://people-groups:8084
      PEOPLE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
      EVIDENCE_BASE_URL: http://evidence-service:8085
      EVIDENCE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN}
    depends_on:
      design-db: {condition: service_healthy}
      project-workspace: {condition: service_healthy}
      people-groups: {condition: service_healthy}
      evidence-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${DESIGN_HOST_PORT:-18087}:8087"]
    networks: [design-data, app]

networks:
  app: {}
  contract-data: {internal: true}
  money-data: {internal: true}
  people-data: {internal: true}
  evidence-data: {internal: true}
  project-data: {internal: true}
  design-data: {internal: true}

volumes:
  contract-db: {}
  contract-evidence: {}
  money-db: {}
  people-db: {}
  evidence-db: {}
  evidence-files: {}
  project-db: {}
  design-db: {}
