worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout combined;
    log_format evidence_data_no_args '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';
    error_log /dev/stderr warn;
    client_max_body_size 25m;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream oms_gateway {
        server gateway:8088;
        keepalive 32;
    }

    # Container-only readiness listener. It is intentionally not published by
    # Compose, so public port 80 remains redirect-only.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /health/ready {
            proxy_http_version 1.1;
            proxy_set_header Host gateway:8088;
            proxy_set_header Connection "";
            proxy_pass http://oms_gateway/health/ready;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name _;
        return 308 https://__D1_PUBLIC_HOST__$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name __D1_PUBLIC_HOST__;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        if ($host != __D1_PUBLIC_HOST__) {
            return 421;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # BEGIN OPTIONAL EVIDENCE DATA PLANE
        # Local-provider file bytes are authenticated by an Evidence-issued,
        # object-bound short-lived capability URL. They bypass the Gateway so
        # large bodies do not consume its request budget; control-plane calls
        # still use the normal Nginx -> Gateway -> Evidence chain.
        location ~ ^/evidence(?<evidence_data_path>/v1/local-(?:uploads|files)/.*)$ {
            set $evidence_data_upstream http://evidence-service:8085;
            client_max_body_size 2g;
            access_log /dev/stdout evidence_data_no_args;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host evidence-service:8085;
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header X-OMS-Subject-ID "";
            proxy_set_header X-OMS-Tenant-ID "";
            proxy_set_header X-OMS-Display-Name "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_read_timeout 960s;
            proxy_send_timeout 960s;
            proxy_pass $evidence_data_upstream$evidence_data_path$is_args$args;
        }
        # END OPTIONAL EVIDENCE DATA PLANE

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_pass http://oms_gateway;
        }
    }
}
