worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout combined;
    log_format evidence_data_no_args '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';
    error_log /dev/stderr warn;
    client_max_body_size 25m;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream oms_gateway {
        server gateway:8088;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # BEGIN OPTIONAL EVIDENCE DATA PLANE
        # Local-provider file bytes are authenticated by an Evidence-issued,
        # object-bound short-lived capability URL. They bypass the Gateway so
        # large bodies do not consume its request budget; control-plane calls
        # still use the normal Nginx -> Gateway -> Evidence chain.
        location ~ ^/evidence(?<evidence_data_path>/v1/local-(?:uploads|files)/.*)$ {
            set $evidence_data_upstream http://evidence-service:8085;
            client_max_body_size 2g;
            access_log /dev/stdout evidence_data_no_args;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host evidence-service:8085;
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header X-OMS-Subject-ID "";
            proxy_set_header X-OMS-Tenant-ID "";
            proxy_set_header X-OMS-Display-Name "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 960s;
            proxy_send_timeout 960s;
            proxy_pass $evidence_data_upstream$evidence_data_path$is_args$args;
        }
        # END OPTIONAL EVIDENCE DATA PLANE

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://oms_gateway;
        }
    }
}
