services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-oms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      CONTRACT_DB_PASSWORD: ${CONTRACT_DB_PASSWORD:?set CONTRACT_DB_PASSWORD}
      MONEY_DB_PASSWORD: ${MONEY_DB_PASSWORD:?set MONEY_DB_PASSWORD}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:?set PEOPLE_DB_PASSWORD}
      PARTY_DB_PASSWORD: ${PARTY_DB_PASSWORD:?set PARTY_DB_PASSWORD}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?set PROJECT_DB_PASSWORD}
      EVIDENCE_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?set EVIDENCE_DB_PASSWORD}
      BUSINESS_ENGAGEMENT_DB_PASSWORD: ${BUSINESS_ENGAGEMENT_DB_PASSWORD:?set BUSINESS_ENGAGEMENT_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      PRODUCTION_DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:?set PRODUCTION_DB_PASSWORD}
      APPROVAL_AUDIT_RESULTS_DB_PASSWORD: ${APPROVAL_AUDIT_RESULTS_DB_PASSWORD:?set APPROVAL_AUDIT_RESULTS_DB_PASSWORD}
      COST_OUTSOURCING_DB_PASSWORD: ${COST_OUTSOURCING_DB_PASSWORD:?set COST_OUTSOURCING_DB_PASSWORD}
      BONUS_DISTRIBUTION_DB_PASSWORD: ${BONUS_DISTRIBUTION_DB_PASSWORD:?set BONUS_DISTRIBUTION_DB_PASSWORD}
      INTERNAL_FINANCE_REQUESTS_DB_PASSWORD: ${INTERNAL_FINANCE_REQUESTS_DB_PASSWORD:?set INTERNAL_FINANCE_REQUESTS_DB_PASSWORD}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?set PAYROLL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-create-app-databases.sh:/docker-entrypoint-initdb.d/01-create-app-databases.sh:ro
    networks: [data]
    restart: unless-stopped

  postgres-provision:
    image: postgres:18.6-alpine
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-oms_admin}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      CONTRACT_DB_PASSWORD: ${CONTRACT_DB_PASSWORD:?set CONTRACT_DB_PASSWORD}
      MONEY_DB_PASSWORD: ${MONEY_DB_PASSWORD:?set MONEY_DB_PASSWORD}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:?set PEOPLE_DB_PASSWORD}
      PARTY_DB_PASSWORD: ${PARTY_DB_PASSWORD:?set PARTY_DB_PASSWORD}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?set PROJECT_DB_PASSWORD}
      EVIDENCE_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD:?set EVIDENCE_DB_PASSWORD}
      BUSINESS_ENGAGEMENT_DB_PASSWORD: ${BUSINESS_ENGAGEMENT_DB_PASSWORD:?set BUSINESS_ENGAGEMENT_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      PRODUCTION_DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:?set PRODUCTION_DB_PASSWORD}
      APPROVAL_AUDIT_RESULTS_DB_PASSWORD: ${APPROVAL_AUDIT_RESULTS_DB_PASSWORD:?set APPROVAL_AUDIT_RESULTS_DB_PASSWORD}
      COST_OUTSOURCING_DB_PASSWORD: ${COST_OUTSOURCING_DB_PASSWORD:?set COST_OUTSOURCING_DB_PASSWORD}
      BONUS_DISTRIBUTION_DB_PASSWORD: ${BONUS_DISTRIBUTION_DB_PASSWORD:?set BONUS_DISTRIBUTION_DB_PASSWORD}
      INTERNAL_FINANCE_REQUESTS_DB_PASSWORD: ${INTERNAL_FINANCE_REQUESTS_DB_PASSWORD:?set INTERNAL_FINANCE_REQUESTS_DB_PASSWORD}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?set PAYROLL_DB_PASSWORD}
    command: ["/provision.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./postgres/01-create-app-databases.sh:/provision.sh:ro
    networks: [data]
    restart: "no"

  project-workload-key-permissions:
    profiles: [project]
    image: omsbizfoundry/project-workspace:${SUITE_VERSION:-dev}
    user: "0:0"
    command: ["sh", "-eu", "-c", "chown postgres:postgres /workload-private /workload-public && chmod 0700 /workload-private && chmod 0755 /workload-public"]
    volumes:
      - project-workload-private:/workload-private
      - iam-workload-public:/workload-public
    restart: "no"

  project-workload-keys:
    profiles: [project]
    image: omsbizfoundry/project-workspace:${SUITE_VERSION:-dev}
    pull_policy: never
    command: ["/app/workload-keyctl", "init"]
    environment: &project-workload-key-environment
      WORKLOAD_ID: project-workspace
      WORKLOAD_SUBJECT_ID: ${PROJECT_WORKLOAD_SUBJECT_ID:-44444444-4444-4444-8444-444444444444}
      WORKLOAD_KEY_FILE: /workload-private/project-workspace.json
      WORKLOAD_PUBLIC_KEY_FILE: /workload-public/project-workspace.json
    depends_on:
      project-workload-key-permissions: {condition: service_completed_successfully}
    volumes:
      - project-workload-private:/workload-private
      - iam-workload-public:/workload-public
    restart: "no"

