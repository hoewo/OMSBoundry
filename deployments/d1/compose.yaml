  identity-migrate:
    build:
      context: ../..
      dockerfile: deployments/d1/docker/Dockerfile.identity
    image: omsbizfoundry/identity-access:${SUITE_VERSION:-dev}
    command: ["/app/ops", "migrate"]
    environment: &identity-environment
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://identity_access:${IDENTITY_DB_PASSWORD}@postgres:5432/identity_access?sslmode=disable
      MIGRATION_MODE: verify
      TENANT_ID: ${TENANT_ID:?set TENANT_ID}
      TENANT_NAME: ${TENANT_NAME:-OMSBizFoundry}
      PUBLIC_ISSUER: ${PUBLIC_ISSUER:-https://oms.example.test/auth}
      SIGNING_KEY_FILE: /data/iam/signing-keys.json
      CAPABILITY_MANIFEST_PATHS: /config/identity-access-capabilities.json,/config/internal-finance-requests-capabilities.json,/config/payroll-capabilities.json,/config/open-api-capabilities.json,/config/feedback-capabilities.json,/config/contract-ledger-capabilities.json,/config/money-flow-ledger-capabilities.json,/config/people-groups-capabilities.json,/config/party-directory-capabilities.json,/config/project-workspace-capabilities.json,/config/evidence-service-capabilities.json,/config/business-engagement-capabilities.json,/config/billing-invoice-capabilities.json,/config/production-operations-capabilities.json,/config/approval-audit-results-capabilities.json,/config/cost-outsourcing-capabilities.json,/config/bonus-distribution-capabilities.json
      SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      PROJECT_POLICY_BASE_URL: http://project-workspace:8086
      PEOPLE_POLICY_BASE_URL: http://people-groups:8084
      POLICY_SERVICE_SUBJECT_ID: ${POLICY_SERVICE_SUBJECT_ID:-33333333-3333-4333-8333-333333333333}
      PERSON_REFERENCE_BASE_URL: http://people-groups:8084
      PERSON_REFERENCE_SERVICE_SUBJECT_ID: ${POLICY_SERVICE_SUBJECT_ID:-33333333-3333-4333-8333-333333333333}
      PROJECT_ASSIGNMENT_POLICY_PATHS: /config/project-assignment-policy.json,/config/business-engagement-project-assignment-policy.json,/config/production-operations-project-assignment-policy.json
      POLICY_TIMEOUT: ${POLICY_TIMEOUT:-3s}
      WORKLOAD_IDENTITY_POLICY_PATH: /config/workload-identity-policy.json
      WORKLOAD_CREDENTIAL_TTL: ${WORKLOAD_CREDENTIAL_TTL:-1m}
    depends_on:
      postgres-provision: {condition: service_completed_successfully}
    volumes:
      - iam-keys:/data/iam
      - ../../contracts/access/v1/examples/identity-access-capabilities.json:/config/identity-access-capabilities.json:ro
      - ../../contracts/access/v1/examples/internal-finance-requests-capabilities.json:/config/internal-finance-requests-capabilities.json:ro
      - ../../contracts/access/v1/examples/payroll-capabilities.json:/config/payroll-capabilities.json:ro
      - ../../contracts/access/v1/examples/open-api-capabilities.json:/config/open-api-capabilities.json:ro
      - ../../contracts/access/v1/examples/feedback-capabilities.json:/config/feedback-capabilities.json:ro
      - ../../contracts/access/v1/examples/contract-ledger-capabilities.json:/config/contract-ledger-capabilities.json:ro
      - ../../contracts/access/v1/examples/money-flow-ledger-capabilities.json:/config/money-flow-ledger-capabilities.json:ro
      - ../../contracts/access/v1/examples/people-groups-capabilities.json:/config/people-groups-capabilities.json:ro
      - ../../contracts/access/v1/examples/party-directory-capabilities.json:/config/party-directory-capabilities.json:ro
      - ../../contracts/access/v1/examples/project-workspace-capabilities.json:/config/project-workspace-capabilities.json:ro
