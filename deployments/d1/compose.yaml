      - ../../contracts/access/v1/examples/cost-outsourcing-capabilities.json:/config/cost-outsourcing-capabilities.json:ro
      - ../../contracts/access/v1/examples/bonus-distribution-capabilities.json:/config/bonus-distribution-capabilities.json:ro
      - ../../contracts/access/v1/examples/project-assignment-policy.json:/config/project-assignment-policy.json:ro
      - ../../contracts/access/v1/examples/business-engagement-project-assignment-policy.json:/config/business-engagement-project-assignment-policy.json:ro
      - ../../contracts/access/v1/examples/production-operations-project-assignment-policy.json:/config/production-operations-project-assignment-policy.json:ro
      - ../../contracts/access/v1/examples/workload-identity-policy.json:/config/workload-identity-policy.json:ro
      - iam-workload-public:/workload-public:ro
      - ${D1_BACKUP_DIR:-./.runtime/backups}:/backups
    networks: [app, data]
    restart: unless-stopped

  public-keys-permissions:
    image: omsbizfoundry/identity-access:${SUITE_VERSION:-dev}
