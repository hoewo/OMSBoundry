name: ${DESIGN_DEMO_COMPOSE_PROJECT:-omsbizfoundry-design-operations-demo}

# Design Operations Level A Demo only. reference-stub implements only the
# versioned public reference-read boundary; it owns no business facts.
services:
  db:
    image: ${DESIGN_DEMO_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: design_operations
      POSTGRES_USER: design_operations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U design_operations -d design_operations"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [db:/var/lib/postgresql]
    networks: [data]

  reference-stub:
    image: ${DESIGN_DEMO_STUB_IMAGE:-omsbizfoundry-design-reference-stub:dev}
    build:
      context: ../../..
      dockerfile: deployments/demos/design-operations/Dockerfile.reference-stub
    environment:
      REFERENCE_STUB_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [references]

  design-operations:
    image: ${DESIGN_DEMO_IMAGE:-omsbizfoundry-design-operations-demo:dev}
    build:
      context: ../../../backend/services/design-operations
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8087
      DATABASE_URL: postgres://design_operations:${POSTGRES_PASSWORD}@db:5432/design_operations?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: 99999999-9999-4999-8999-999999999999
      TEMPLATE_SUBJECT_ID: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
      TEMPLATE_DISPLAY_NAME: Design Demo 管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN:?run ./ops/demo init}
      REFERENCE_TIMEOUT: 2s
      PROJECT_BASE_URL: http://reference-stub:9090
      PROJECT_ACCESS_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
      EVIDENCE_BASE_URL: http://reference-stub:9090
      EVIDENCE_ACCESS_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
    depends_on:
      db: {condition: service_healthy}
      reference-stub: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${DESIGN_DEMO_PORT:-28087}:8087"]
    networks: [data, references, demo]

volumes:
  db:

networks:
  data:
    internal: true
    ipam:
      config: [{subnet: 10.253.33.0/24}]
  references:
    internal: true
    ipam:
      config: [{subnet: 10.253.34.0/24}]
  demo:
    ipam:
      config: [{subnet: 10.253.35.0/24}]
