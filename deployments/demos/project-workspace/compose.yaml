name: ${PROJECT_DEMO_COMPOSE_PROJECT:-omsbizfoundry-project-workspace-demo}

# Project Workspace Level A Demo only. reference-stub implements only the
# versioned public reference-read boundary; it owns no business facts.
services:
  db:
    image: ${PROJECT_DEMO_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: project_workspace
      POSTGRES_USER: project_workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U project_workspace -d project_workspace"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [db:/var/lib/postgresql]
    networks: [data]

  reference-stub:
    image: ${PROJECT_DEMO_STUB_IMAGE:-omsbizfoundry-project-reference-stub:dev}
    build:
      context: ../../..
      dockerfile: deployments/demos/project-workspace/Dockerfile.reference-stub
    environment:
      REFERENCE_STUB_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [references]

  project-workspace:
    image: ${PROJECT_DEMO_IMAGE:-omsbizfoundry-project-workspace-demo:dev}
    build:
      context: ../../..
      dockerfile: backend/services/project-workspace/Dockerfile
    environment:
      HTTP_ADDR: :8086
      DATABASE_URL: postgres://project_workspace:${POSTGRES_PASSWORD}@db:5432/project_workspace?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      TEMPLATE_TENANT_ID: 99999999-9999-4999-8999-999999999999
      TEMPLATE_SUBJECT_ID: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
      TEMPLATE_DISPLAY_NAME: Project Demo 管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN:?run ./ops/demo init}
      REFERENCE_TIMEOUT: 2s
      PEOPLE_BASE_URL: http://reference-stub:9090
      PEOPLE_ACCESS_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
      CONTRACT_BASE_URL: http://reference-stub:9090
      CONTRACT_ACCESS_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
      EVIDENCE_BASE_URL: http://reference-stub:9090
      EVIDENCE_ACCESS_TOKEN: ${REFERENCE_STUB_TOKEN:?run ./ops/demo init}
    depends_on:
      db: {condition: service_healthy}
      reference-stub: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8086/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${PROJECT_DEMO_PORT:-28086}:8086"]
    networks: [data, references, demo]

volumes:
  db:

networks:
  data:
    internal: true
    ipam:
      config: [{subnet: 10.253.30.0/24}]
  references:
    internal: true
    ipam:
      config: [{subnet: 10.253.31.0/24}]
  demo:
    ipam:
      config: [{subnet: 10.253.32.0/24}]
