name: ${MONEY_DEMO_COMPOSE_PROJECT:-omsbizfoundry-money-flow-ledger-demo}

# Money Flow Ledger Level A Demo only. It deliberately starts no Nginx,
# Gateway, central IAM, Workbench, or neighboring business application.
services:
  db:
    image: ${MONEY_DEMO_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: money_flow_ledger
      POSTGRES_USER: money_flow_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U money_flow_ledger -d money_flow_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [db:/var/lib/postgresql]
    networks: [data]

  money-flow-ledger:
    image: ${MONEY_DEMO_IMAGE:-omsbizfoundry-money-flow-ledger-demo:dev}
    build:
      context: ../../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: money-flow-ledger}
    environment:
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://money_flow_ledger:${POSTGRES_PASSWORD}@db:5432/money_flow_ledger?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: local
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Money Flow Demo 管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?run ./ops/demo init}
      REFERENCE_TENANT_ID: 44444444-4444-4444-8444-444444444444
      REFERENCE_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN:?run ./ops/demo init}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${MONEY_DEMO_PORT:-28083}:8083"]
    networks: [data, demo]

volumes:
  db:

networks:
  data:
    internal: true
  demo:

