name: ${PEOPLE_DEMO_COMPOSE_PROJECT:-omsbizfoundry-people-groups-demo}

# People & Groups Level A Demo only. It deliberately starts no Nginx,
# Gateway, central IAM, Workbench, or neighboring business application.
services:
  db:
    image: ${PEOPLE_DEMO_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: people_groups
      POSTGRES_USER: people_groups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U people_groups -d people_groups"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [db:/var/lib/postgresql]
    networks: [data]

  people-groups:
    image: ${PEOPLE_DEMO_IMAGE:-omsbizfoundry-people-groups-demo:dev}
    build:
      context: ../../..
      dockerfile: deployments/d1/docker/Dockerfile.people
    environment:
      HTTP_ADDR: :8084
      DATABASE_URL: postgres://people_groups:${POSTGRES_PASSWORD}@db:5432/people_groups?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: template
      SESSION_COOKIE_SECURE: "false"
      TEMPLATE_TENANT_ID: 55555555-5555-4555-8555-555555555555
      TEMPLATE_SUBJECT_ID: 66666666-6666-4666-8666-666666666666
      TEMPLATE_DISPLAY_NAME: People Demo 管理员
      TEMPLATE_ACCESS_TOKEN: ${TEMPLATE_ACCESS_TOKEN:?run ./ops/demo init}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${PEOPLE_DEMO_PORT:-28084}:8084"]
    networks: [data, demo]

volumes:
  db:

networks:
  data:
    internal: true
  demo:
