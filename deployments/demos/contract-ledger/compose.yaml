name: ${CONTRACT_DEMO_COMPOSE_PROJECT:-omsbizfoundry-contract-ledger-demo}

# Contract Ledger Level A Demo only. It deliberately starts no Nginx, Gateway,
# central IAM, Workbench, or neighboring business application.
services:
  db:
    image: ${CONTRACT_DEMO_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: contract_ledger
      POSTGRES_USER: contract_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/demo init}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U contract_ledger -d contract_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [db:/var/lib/postgresql]
    networks: [data]

  contract-ledger:
    image: ${CONTRACT_DEMO_IMAGE:-omsbizfoundry-contract-ledger-demo:dev}
    build:
      context: ../../..
      dockerfile: deployments/local-oa/Dockerfile.app
      args: {APP: contract-ledger}
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://contract_ledger:${POSTGRES_PASSWORD}@db:5432/contract_ledger?sslmode=disable
      MIGRATION_MODE: auto
      IDENTITY_PROVIDER: local
      SESSION_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Contract Demo 管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?run ./ops/demo init}
      REFERENCE_TENANT_ID: 33333333-3333-4333-8333-333333333333
      REFERENCE_ACCESS_TOKEN: ${REFERENCE_ACCESS_TOKEN:?run ./ops/demo init}
      EVIDENCE_STORAGE_DIR: /data/evidence
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${CONTRACT_DEMO_PORT:-28081}:8081"]
    volumes: [evidence:/data/evidence]
    networks: [data, demo]

volumes:
  db:
  evidence:

networks:
  data:
    internal: true
  demo:
