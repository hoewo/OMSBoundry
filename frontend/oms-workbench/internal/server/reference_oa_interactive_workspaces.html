{{define "userDirectoryForm"}}
<form class="user-management-page__drawer-form" data-user-form data-user-form-mode="{{.Mode}}" novalidate>
  <div class="user-management-page__drawer-note user-management-page__drawer-note--info">当前抽屉复刻参考 OA 的人员维护流程；验证提交不会绕过 IAM 或 People &amp; Groups。</div>
  <section class="user-management-page__drawer-section"><div class="user-management-page__drawer-section-head"><h3>账号信息</h3><p>维护登录账号、联系方式与启用状态。</p></div><div class="user-directory-form__grid"><label class="user-directory-form__field"><span>用户名/手机号 <b>*</b></span><input class="ant-input" name="user_account" autocomplete="off" value="{{.Account}}" placeholder="请输入手机号" required></label><label class="user-directory-form__field"><span>邮箱（可选）</span><input class="ant-input" name="contact_address" autocomplete="off" type="text" inputmode="email" pattern="[^ @]+@[^ @]+\.[^ @]+" value="{{.Email}}" placeholder="请输入邮箱（可选）"></label><label class="user-directory-form__switch"><span>已验证</span><input type="checkbox" name="verified" {{if eq .Mode "edit"}}checked{{end}}><i>{{if eq .Mode "edit"}}已验证{{else}}未验证{{end}}</i></label><label class="user-directory-form__switch"><span>状态</span><input type="checkbox" name="active" checked><i>激活</i></label></div></section>
  <section class="user-management-page__drawer-section"><div class="user-management-page__drawer-section-head"><h3>本地资料</h3><p>用于展示目录、归档与项目参与人识别。</p></div><div class="user-directory-form__grid"><label class="user-directory-form__field"><span>真实姓名</span><input class="ant-input" name="real_name" value="{{.Name}}" placeholder="请输入真实姓名（可选）"></label><label class="user-directory-form__field"><span>部门</span><select class="ant-input" name="department"><option value="">请选择部门（可选）</option><option>经营部</option><option>生产部</option><option>财务室</option><option>综合部</option><option>设计一所</option><option>设计二所</option></select></label></div></section>
  <section class="user-management-page__drawer-section"><div class="user-management-page__drawer-section-head"><h3>角色与权限</h3><p>至少选择一个 OA 角色，后续项目内角色基于此分配。</p></div><label class="user-directory-form__field"><span>角色 <b>*</b></span><select class="ant-input" name="role" required><option value="">请选择角色（至少一个）</option><option value="business_manager">经营经理</option><option value="production_manager">生产经理</option><option value="finance_manager">财务室主任</option><option value="project_manager">项目负责人</option><option value="member">普通职员</option></select></label></section>
  <div class="user-management-page__drawer-note user-directory-form__result" hidden data-user-form-note><strong>界面校验已通过</strong><br>真实账号、人员与角色写入仍通过版本化 IAM／People &amp; Groups 契约。</div>
  <div class="user-management-page__form-actions"><div class="user-management-page__form-actions-group"><button class="ant-btn" type="button" data-user-form-close>取消</button><button class="ant-btn ant-btn-primary" type="submit">{{if eq .Mode "edit"}}更新人员{{else}}新增人员{{end}}</button></div></div>
</form>
{{end}}
