<!-- Project-detail surfaces keep the reference OA class contract and hierarchy. -->
<template data-detail-template="overview">
  <div class="project-workspace basic-info-tab__workspace">
    <section class="project-section-card basic-info-tab__unified">
      <header class="project-section-card__header project-section-card__header--blue">
        <div class="project-section-card__title"><span class="reference-icon">▧</span><span>项目基本信息</span></div>
        <div class="reference-action-cluster"><span class="reference-demo-label">界面验证数据</span><button class="ant-btn" type="button" data-project-profile-edit-open>✎ 编辑</button></div>
      </header>
      <div class="project-section-card__body basic-info-tab__unified-body">
        <div class="basic-info-tab__readonly-grid">
          <div class="project-workspace__field"><span class="project-workspace__field-label">项目名称</span><strong class="project-workspace__field-value" data-detail-field="name">京哈高速改造工程</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">项目编号</span><strong class="project-workspace__field-value" data-detail-field="number">JH-2026-018</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">承接日期</span><strong class="project-workspace__field-value" data-detail-field="date">2026年3月1日</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">资质单位</span><strong class="project-workspace__field-value" data-detail-field="qualification">北京京宏勘察设计有限公司</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">管理费率</span><strong class="project-workspace__field-value" data-detail-field="management-fee">15.00%</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">项目类型</span><strong class="project-workspace__field-value" data-detail-field="type"><span class="ant-tag">公路设计</span><span class="ant-tag">改扩建</span></strong></div>
          <div class="project-workspace__field project-workspace__field--wide"><span class="project-workspace__field-label">项目概况</span><strong class="project-workspace__field-value project-workspace__field-value--multiline" data-detail-field="summary">京哈高速既有路段改扩建工程，包含路线、路基路面、桥涵及交通工程设计。本页用于验证参考 OA 的项目详情信息架构与装配关系。</strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">项目经营负责人</span><strong class="project-workspace__field-value" data-detail-field="business-manager"><span class="reference-avatar">李</span><span data-detail-person-name>李晨</span></strong></div>
          <div class="project-workspace__field"><span class="project-workspace__field-label">项目生产负责人</span><strong class="project-workspace__field-value" data-detail-field="production-manager"><span class="reference-avatar reference-avatar--teal">周</span><span data-detail-person-name>周宁</span></strong></div>
        </div>
        <div class="basic-info-tab__domain-grid">
          <article class="basic-info-tab__domain-card"><div class="basic-info-tab__domain-heading"><span>经营进度</span><strong data-detail-field="business-stage">合同阶段</strong></div><div class="basic-info-tab__lane basic-info-tab__lane--business"><div class="basic-info-tab__lane-top"><span class="basic-info-tab__lane-title">经营</span><span class="basic-info-tab__lane-chip" data-detail-field="business-chip">合同已确认</span><span class="basic-info-tab__lane-count" data-detail-field="business-progress">3/4</span></div><div class="basic-info-tab__lane-segments"><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--done"></span><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--done"></span><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--current"></span><span class="basic-info-tab__lane-segment"></span></div></div></article>
          <article class="basic-info-tab__domain-card"><div class="basic-info-tab__domain-heading"><span>生产进度</span><strong data-detail-field="production-stage">施工图设计</strong></div><div class="basic-info-tab__lane basic-info-tab__lane--production"><div class="basic-info-tab__lane-top"><span class="basic-info-tab__lane-title">生产</span><span class="basic-info-tab__lane-chip" data-detail-field="production-chip">施工图设计</span><span class="basic-info-tab__lane-count" data-detail-field="production-progress">3/5</span></div><div class="basic-info-tab__lane-segments"><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--done"></span><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--done"></span><span class="basic-info-tab__lane-segment basic-info-tab__lane-segment--current"></span><span class="basic-info-tab__lane-segment"></span><span class="basic-info-tab__lane-segment"></span></div></div></article>
        </div>
        <div class="basic-info-tab__related-actions"><button class="ant-btn" type="button" data-view-target="clients">甲方管理</button><button class="ant-btn" type="button" data-view-target="qualification-units">资质单位管理</button></div>
      </div>
    </section>
    <div class="reference-drawer-mask project-profile-drawer" data-project-profile-drawer>
      <aside class="reference-drawer" role="dialog" aria-modal="true" aria-labelledby="project-profile-drawer-title">
        <header class="reference-drawer__head"><strong id="project-profile-drawer-title">编辑项目基本信息</strong><button class="reference-drawer__close" type="button" aria-label="关闭" data-project-profile-edit-close>×</button></header>
        <div class="reference-drawer__body">
          <form class="reference-entity-form project-profile-form" data-project-profile-form novalidate>
            <div class="reference-entity-form__grid">
              <label class="reference-entity-form__field"><span>项目名称 <b>*</b></span><input class="ant-input" name="project_name" autocomplete="off" required><small>显示在项目列表和项目详情中的正式名称</small></label>
              <label class="reference-entity-form__field"><span data-project-number-label>项目编号 <b>*</b></span><input class="ant-input" name="project_number" autocomplete="off" required placeholder="请输入正式项目编号"><small data-project-number-help>项目正式立项后的唯一业务编号</small></label>
              <label class="reference-entity-form__field"><span>承接日期</span><input class="ant-input" name="start_date" type="date"><small>项目正式承接或启动的日期</small></label>
              <label class="reference-entity-form__field"><span>资质单位</span><input class="ant-input" name="qualification_unit_name" list="project-qualification-options" autocomplete="off" placeholder="输入资质单位名称"><datalist id="project-qualification-options"><option value="北京京宏勘察设计有限公司"></option><option value="华北路桥勘察设计有限公司"></option><option value="中交公路规划设计院有限公司"></option></datalist><small>行内自动补全，按 Tab 接受；保存时写入当前项目</small></label>
              <label class="reference-entity-form__field"><span>管理费率（%）</span><span class="project-profile-form__number"><input class="ant-input" name="management_fee_ratio" type="number" min="0" max="100" step="0.01"><i>%</i></span><small>支持两位小数；留空表示尚未设置</small></label>
              <label class="reference-entity-form__field reference-entity-form__field--full"><span>项目概况</span><textarea class="ant-input project-profile-form__overview" name="project_overview" rows="5" maxlength="1000"></textarea><small class="project-profile-form__counter"><span>说明项目范围、阶段和主要工作内容</span><b data-project-overview-count>0 / 1000</b></small></label>
              <fieldset class="reference-entity-form__field project-profile-form__types"><legend>项目类型 <b>*</b></legend><div class="project-profile-form__type-control" data-project-type-control><label><input type="checkbox" name="project_type_keys" value="road-design"><span>公路设计</span></label><label><input type="checkbox" name="project_type_keys" value="reconstruction"><span>改扩建</span></label><label><input type="checkbox" name="project_type_keys" value="municipal"><span>市政道路</span></label><label><input type="checkbox" name="project_type_keys" value="survey"><span>勘察</span></label></div><small data-project-type-error>请选择至少一种项目类型</small></fieldset>
              <label class="reference-entity-form__field"><span>项目经营负责人</span><select class="ant-input" name="business_manager_id"><option value="">请选择</option><option>李晨</option><option>王可</option><option>赵清</option></select><small>负责经营承接、合同和回款协同</small></label>
              <label class="reference-entity-form__field"><span>项目生产负责人</span><select class="ant-input" name="production_manager_id"><option value="">请选择</option><option>周宁</option><option>陈工</option><option>孙博</option></select><small>负责生产组织、成果和进度协同</small></label>
            </div>
            <div class="reference-entity-form__note" data-project-profile-note hidden><strong>界面校验已通过</strong><span>本次仿制只验证参考 OA 的表单与操作路径；正式保存必须经 Project Workspace 版本化 API 与 IAM 授权，不会在浏览器里伪造业务事实。</span></div>
            <div class="reference-entity-form__actions"><button class="ant-btn" type="button" data-project-profile-edit-close>× 取消</button><button class="ant-btn ant-btn-primary" type="submit">✓ 保存</button></div>
          </form>
        </div>
      </aside>
    </div>
  </div>
</template>

<template data-project-dialogs-template>
  <div class="reference-drawer-mask project-child-drawer" data-project-child-drawer>
    <aside class="reference-drawer" role="dialog" aria-modal="true" aria-labelledby="project-child-drawer-title">
      <header class="reference-drawer__head"><strong id="project-child-drawer-title">添加子项目</strong><button class="reference-drawer__close" type="button" aria-label="关闭" data-project-child-close>×</button></header>
      <div class="reference-drawer__body">
        <div class="project-detail-page__child-drawer-intro" data-project-child-intro>子项目将归入当前项目包，经营信息沿用项目包，生产与收付款按子项目独立维护。</div>
        <form class="reference-entity-form" data-project-child-form novalidate>
          <label class="reference-entity-form__field"><span>子项目名称 <b>*</b></span><textarea class="ant-input project-child-form__name" name="project_name" rows="2" maxlength="200" required placeholder="请输入子项目名称"></textarea><small>完整填写子项目正式名称</small></label>
          <label class="reference-entity-form__field"><span>子项目编号 <b>*</b></span><input class="ant-input" name="project_number" required pattern="[A-Za-z0-9_-]+" placeholder="例如 HNJH2025-005J01"><small>请填写完整编号，只能包含字母、数字、下划线和连字符</small></label>
          <div class="reference-entity-form__note" data-project-child-note hidden><strong>子项目表单校验已通过</strong><span>正式创建必须经 Project Workspace 与 IAM；界面演示不会伪造子项目事实。</span></div>
          <div class="reference-entity-form__actions"><button class="ant-btn" type="button" data-project-child-close>取消</button><button class="ant-btn ant-btn-primary" type="submit">创建子项目</button></div>
        </form>
      </div>
    </aside>
  </div>

  <div class="reference-modal-mask project-package-conversion" hidden data-project-conversion-dialog>
    <section class="reference-modal project-package-conversion__dialog" role="dialog" aria-modal="true" aria-labelledby="project-conversion-title">
      <header><h3 id="project-conversion-title" class="project-package-conversion__title"><span>盾</span><span>调整项目包归属</span><em>试用功能</em></h3><button type="button" aria-label="关闭" data-project-conversion-close>×</button></header>
      <div class="project-package-conversion__body">
        <div class="project-package-conversion__warning"><strong>⚠ 高风险操作保护已开启</strong><span>仅超级管理员可执行；必须先完成预检并输入确认文字。正式后端使用事务、行锁、更新时间校验、幂等键和审计记录。</span></div>
        <form class="reference-entity-form project-package-conversion__form" data-project-conversion-form>
          <fieldset class="project-package-conversion__mode-field"><legend>选择操作</legend><div class="project-package-conversion__mode-group"><label><input type="radio" name="operation" value="wrap_as_package" checked><span>▣ 普通项目转换为项目包</span></label><label><input type="radio" name="operation" value="attach_existing"><span>⌘ 加入已有项目包</span></label></div></fieldset>
          <div class="project-package-conversion__fields" data-project-conversion-wrap><label class="reference-entity-form__field"><span>新项目包名称 <b>*</b></span><input class="ant-input" name="package_name" maxlength="200" required></label><label class="reference-entity-form__field"><span>新项目包编号（选填）</span><input class="ant-input" name="package_number" maxlength="100"><small>原项目编号不会变化；项目包可以暂不编号。</small></label></div>
          <label class="reference-entity-form__field" data-project-conversion-attach hidden><span>目标项目包 <b>*</b></span><select class="ant-input" name="target_package_id"><option value="">搜索并选择项目包</option><option value="north-ring">北环快速路工程项目包（BH-2026-P01）</option></select></label>
          <div><button class="ant-btn" type="submit">盾 生成安全预检</button></div>
        </form>
        <section class="project-package-conversion__preview" data-project-conversion-preview hidden><h4>预检结果</h4><div class="project-package-conversion__success"><strong>✓ 不会合并或迁移历史业务数据</strong><span>原项目 ID、合同、财务、生产与附件事实全部保留。</span></div><div class="project-package-conversion__inventory"><div><span>合同</span><strong>2</strong><small>条，保留原项目 ID</small></div><div><span>财务记录</span><strong>8</strong><small>条，保留原项目 ID</small></div><div><span>附件</span><strong>12</strong><small>条，保留原项目 ID</small></div><div><span>项目人员</span><strong>6</strong><small>条，保留原项目 ID</small></div><div><span>生产文件</span><strong>18</strong><small>条，保留原项目 ID</small></div><div><span>奖金记录</span><strong>3</strong><small>条，保留原项目 ID</small></div></div><div class="project-package-conversion__confirm"><strong>请输入“确认调整项目层级”</strong><input class="ant-input" data-project-conversion-confirm placeholder="确认调整项目层级" autocomplete="off"><button class="ant-btn ant-btn-primary" type="button" data-project-conversion-execute disabled>确认执行</button></div><div class="reference-entity-form__note" data-project-conversion-note hidden><strong>预检交互已验证</strong><span>只读演示未执行层级调整；正式操作必须由 Project Workspace 事务、幂等与审计保护。</span></div></section>
      </div>
    </section>
  </div>

  <div class="confirm-delete" hidden data-project-delete-dialog>
    <section class="confirm-delete__dialog" role="dialog" aria-modal="true" aria-labelledby="project-delete-title">
      <header class="confirm-delete__header"><span class="confirm-delete__icon">!</span><div><h3 id="project-delete-title" data-project-delete-title>强制确认删除项目</h3><p data-project-delete-description>删除后仅移除当前项目，并清理当前项目关联的文件记录和对象存储目录。</p></div></header>
      <div class="project-detail-page__delete-package-warning" data-project-delete-package-warning hidden><strong>项目包内全部子项目将一并删除</strong><span>包含经营、生产、合同、财务等历史数据的子项目也将从系统页面中移除。</span></div>
      <div class="project-detail-page__delete-project-name"><div class="project-detail-page__delete-project-heading"><span data-project-delete-kind>即将删除项目</span><span class="project-detail-page__delete-project-number" data-project-delete-number>编号 —</span></div><strong data-project-delete-name>—</strong></div>
      <label class="reference-entity-form__field"><span data-project-delete-confirm-label>请输入“确认删除项目”后继续</span><input class="ant-input" data-project-delete-confirm autocomplete="off" placeholder="请输入确认文字"></label>
      <div class="confirm-delete__warning" data-project-delete-warning>此操作不可恢复，请确认当前项目确实不再需要。界面演示不会执行删除。</div>
      <div class="reference-entity-form__note" data-project-delete-note hidden><strong>删除保护交互已验证</strong><span>只读演示没有删除 Project Workspace 的任何业务事实。</span></div>
      <footer class="confirm-delete__footer"><button class="ant-btn" type="button" data-project-delete-close>取消</button><button class="ant-btn ant-btn-danger" type="button" data-project-delete-confirm-action disabled>确认删除</button></footer>
    </section>
  </div>

  <div class="reference-modal-mask" hidden data-project-deactivate-dialog><section class="reference-modal project-deactivate-dialog" role="dialog" aria-modal="true" aria-labelledby="project-deactivate-title"><header><h3 id="project-deactivate-title">停用子项目</h3><button type="button" data-project-deactivate-close aria-label="关闭">×</button></header><div class="project-deactivate-dialog__body"><p><strong data-project-deactivate-name>当前子项目</strong> 停用后不再作为进行中项目展示，已有生产、收付款和文件数据都会保留。</p><div class="reference-entity-form__note" data-project-deactivate-note hidden><strong>停用保护交互已验证</strong><span>只读演示没有改变 Project Workspace 的项目状态。</span></div><div class="reference-modal__actions"><button class="ant-btn" type="button" data-project-deactivate-close>取消</button><button class="ant-btn ant-btn-danger" type="button" data-project-deactivate-confirm>确认停用</button></div></div></section></div>

  <div class="reference-drawer-mask contract-detail-drawer" data-contract-drawer>
    <aside class="reference-drawer contract-detail-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="contract-drawer-title">
      <header class="reference-drawer__head"><strong id="contract-drawer-title" data-contract-drawer-title>合同详情</strong><div class="contract-detail-drawer__head-actions"><button class="ant-btn" type="button" data-view-target="contract-detail">查看完整详情</button><button class="ant-btn ant-btn-danger" type="button" data-contract-delete-open>⌫ 删除</button><button class="reference-drawer__close" type="button" aria-label="关闭" data-contract-close>×</button></div></header>
      <div class="reference-drawer__body contract-detail-drawer__body">
        <form class="contract-form" data-contract-form novalidate>
          <div class="contract-detail-drawer__chain" data-contract-chain-label>甲方合同</div>
          <section class="contract-form__settlement"><div class="contract-form__settlement-head"><div><div class="contract-form__eyebrow">结算概览</div><h2 class="contract-form__settlement-title">结算金额</h2><p class="contract-form__settlement-description">最终用于解释当前合同结算口径的金额，优先独立展示在最上方。</p></div><label class="contract-form__sync"><input type="checkbox" name="settlement_follows_contract_amount" checked><span>保持与当前有效合同金额同步</span></label></div><div class="contract-form__settlement-value" data-contract-settlement>¥0.00</div><span class="contract-form__settlement-hint">当前会随有效合同金额自动同步；原合同或补充协议发生金额变更后，这里会一起变化。</span></section>
          <section class="contract-form__block"><header class="contract-form__block-header"><div><h3 class="contract-form__block-title">原始合同区域</h3><p class="contract-form__block-description">这里维护基础合同信息、费用明细以及合同原件文件。</p></div></header><div class="reference-entity-form__grid"><label class="reference-entity-form__field"><span>合同编号 <b>*</b></span><input class="ant-input" name="contract_number" required placeholder="HT-YYYY-XXX"></label><label class="reference-entity-form__field"><span>签订日期 <b>*</b></span><input class="ant-input" name="sign_date" type="date" required></label><label class="reference-entity-form__field"><span>合同费率（%）</span><input class="ant-input" name="contract_rate" type="number" min="0" max="100" step="0.01" placeholder="例如：15.5"></label><label class="reference-entity-form__field"><span>原合同金额</span><input class="ant-input" name="contract_amount" readonly value="0.00"></label></div><div class="contract-form__subsection"><div class="contract-form__subsection-header"><h4 class="contract-form__subsection-title">费用明细</h4><p class="contract-form__subsection-description">设计费、勘察费、咨询费会自动汇总到原合同金额。</p></div><div class="contract-detail-drawer__fee-grid"><label class="reference-entity-form__field"><span>设计费</span><input class="ant-input" name="design_fee" type="number" min="0" step="0.01" value="0"></label><label class="reference-entity-form__field"><span>勘察费</span><input class="ant-input" name="survey_fee" type="number" min="0" step="0.01" value="0"></label><label class="reference-entity-form__field"><span>咨询费</span><input class="ant-input" name="consultation_fee" type="number" min="0" step="0.01" value="0"></label></div><div class="contract-form__inline-note">原合同金额根据三类费用自动汇总：<strong data-contract-reference-amount>¥0.00</strong></div></div><div class="contract-detail-drawer__file"><div><strong>合同文件</strong><span>支持多个文件，单个文件最大 500MB</span></div><button class="ant-btn" type="button" data-contract-file-action>＋ 选择文件</button><em data-contract-file-name>尚未选择文件</em></div
