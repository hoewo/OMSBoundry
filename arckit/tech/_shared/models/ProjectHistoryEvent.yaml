# ProjectHistoryEvent 数据模型
# 路径: arckit/tech/_shared/models/ProjectHistoryEvent.yaml

metadata:
  path: "tech/_shared/models/ProjectHistoryEvent.yaml"
  domain: "project-workspace"
  entity_name: "ProjectHistoryEvent"
  storage: "PostgreSQL"
  owner: "Project Workspace"
  version: "1.0"
  created: "2026-09-25"
  updated: "2026-09-25"

type: object
additionalProperties: false
description: "与成功写命令原子提交的不可变 Project 历史事件。"

required:
  - id
  - tenant_id
  - project_id
  - project_revision
  - event_sequence
  - event_type
  - command_id
  - actor_subject
  - occurred_at
  - payload

properties:
  id:
    type: string
    format: uuid
    readOnly: true
  tenant_id:
    type: string
    minLength: 1
    maxLength: 128
    readOnly: true
  project_id:
    type: string
    format: uuid
    readOnly: true
  project_revision:
    type: integer
    minimum: 1
    readOnly: true
  event_sequence:
    type: integer
    minimum: 1
    readOnly: true
  event_type:
    type: string
    enum:
      - project_created
      - project_details_replaced
      - project_initiation_pending
      - project_activated
      - project_cancelled
      - assignment_started
      - assignment_ended
      - resource_linked
      - resource_unlinked
  command_id:
    type: string
    format: uuid
    readOnly: true
  actor_subject:
    type: string
    minLength: 1
    maxLength: 256
    readOnly: true
  occurred_at:
    type: string
    format: date-time
    readOnly: true
  payload:
    type: object
    description: "按 event_type 校验的 Project 自有字段或稳定引用；禁止保存外部完整业务响应。"
    readOnly: true

relationships:
  project:
    type: many-to-one
    target: Project
    ownership: project-workspace

indexes:
  - name: uq_project_history_revision_sequence
    columns: [tenant_id, project_id, project_revision, event_sequence]
    unique: true
  - name: uq_project_history_command_event
    columns: [tenant_id, command_id, event_type]
    unique: true

