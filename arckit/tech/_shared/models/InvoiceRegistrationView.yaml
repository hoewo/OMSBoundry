# Billing / Invoice 权限收敛登记视图
metadata:
  path: "tech/_shared/models/InvoiceRegistrationView.yaml"
  domain: "billing-invoice"
  entity_name: "InvoiceRegistrationView"
  storage: "none"
  owner: "Billing / Invoice"
  version: "1.0"
  created: "2026-09-27"
  updated: "2026-09-27"

type: object
additionalProperties: false
description: "由 Billing 服务端按已验证 Credential、资源范围和当前状态形成的 API 视图；不是可写事实。"
required: [id, tenant_id, status, issued_on, amount_visible, amount_minor, currency, issuer_party, recipient_party, source_refs, evidence_refs, revision, created_at, updated_at, allowed_actions]
properties:
  id: {type: string, format: uuid, readOnly: true}
  tenant_id: {type: string, format: uuid, readOnly: true}
  status: {type: string, enum: [recorded, registration_invalidated], readOnly: true}
  issued_on: {type: string, format: date}
  amount_visible: {type: boolean, readOnly: true, description: "仅当 Credential 含 billing-invoice.amount.read 且 Scope 覆盖当前登记时为 true。"}
  amount_minor: {type: [integer, "null"], minimum: 1, description: "amount_visible=false 时固定为 null；禁止返回 0、空串或真实金额。"}
  currency: {type: [string, "null"], pattern: "^[A-Z]{3}$", description: "amount_visible=false 时固定为 null。"}
  issuer_party: {$ref: "InvoiceRegistration.yaml#/$defs/party_snapshot"}
  recipient_party: {$ref: "InvoiceRegistration.yaml#/$defs/party_snapshot"}
  source_refs:
    type: array
    minItems: 1
    items: {$ref: "InvoiceRegistration.yaml#/$defs/source_snapshot"}
  evidence_refs:
    type: array
    items: {$ref: "InvoiceRegistration.yaml#/$defs/evidence_ref"}
  note: {type: string, maxLength: 2000}
  revision: {type: integer, minimum: 1, readOnly: true}
  created_at: {type: string, format: date-time, readOnly: true}
  updated_at: {type: string, format: date-time, readOnly: true}
  allowed_actions:
    type: array
    uniqueItems: true
    readOnly: true
    items: {type: string, enum: [read, amount_read, correct, registration_invalidate, evidence_manage, history_read]}

visibility_invariants:
  - "amount_visible=true requires non-null amount_minor and currency."
  - "amount_visible=false requires amount_minor=null and currency=null."
  - "The client must not infer authorization from null alone; amount_visible is the explicit reason flag."
