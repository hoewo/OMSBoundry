# DesignStage 数据模型
metadata:
  path: "tech/_shared/models/DesignStage.yaml"
  domain: "design-operations"
  entity_name: "DesignStage"
  storage: "PostgreSQL"
  owner: "Design Operations"
  version: "1.0"
  created: "2026-09-25"
  updated: "2026-09-25"
type: object
additionalProperties: false
required: [id, tenant_id, work_item_id, stage_key, sequence, state, required_deliverable_keys, created_at, updated_at]
properties:
  id: {type: string, format: uuid, readOnly: true}
  tenant_id: {type: string, minLength: 1, maxLength: 128, readOnly: true}
  work_item_id: {type: string, format: uuid, readOnly: true}
  stage_key: {type: string, enum: [scheme, preliminary-design, construction-drawing, construction-support]}
  sequence: {type: integer, enum: [10, 20, 30, 40]}
  state: {type: string, enum: [pending, ready, completed, not-applicable]}
  required_deliverable_keys:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, const: primary-output}
  not_applicable_reason: {type: [string, "null"], maxLength: 1000}
  completed_work_item_revision: {type: [integer, "null"], minimum: 1, readOnly: true}
  updated_work_item_revision: {type: integer, minimum: 1, readOnly: true}
  created_at: {type: string, format: date-time, readOnly: true}
  updated_at: {type: string, format: date-time, readOnly: true}
indexes:
  - {name: uq_design_stage_key, columns: [tenant_id, work_item_id, stage_key], unique: true}
  - {name: uq_design_ready_stage, columns: [tenant_id, work_item_id], unique: true, where: "state = 'ready'"}
