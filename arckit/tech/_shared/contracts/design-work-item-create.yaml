# 创建 Design Work Item API 契约
metadata: {path: "tech/_shared/contracts/design-work-item-create.yaml", domain: "design-operations", owner: "Design Operations", version: "1.0", created: "2026-09-25", updated: "2026-09-25"}
endpoint: {method: POST, path: "/api/v1/design-work-items", summary: "为 active design Project 创建 design-v1 Work Item", auth_required: true, audience: "design-operations", capability: "design-work-item.create"}
request:
  body:
    type: object
    additionalProperties: false
    required: [command_id, project_id, project_source_revision]
    properties:
      command_id: {type: string, format: uuid}
      project_id: {type: string, format: uuid}
      project_source_revision: {type: integer, minimum: 1}
responses:
  success: {status: 201, schema: {$ref: "../models/DesignWorkItem.yaml"}}
  errors:
    - {status: 401, code: UNAUTHENTICATED, retryable: false}
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 409, code: ACTIVE_WORK_ITEM_CONFLICT, retryable: false}
    - {status: 409, code: COMMAND_PAYLOAD_CONFLICT, retryable: false}
    - {status: 422, code: PROJECT_REFERENCE_INVALID, retryable: false}
    - {status: 503, code: PROJECT_REFERENCE_UNAVAILABLE, retryable: true}
business_logic:
  flow: ["验证同 tenant Project 为 active、包含 design 且 revision 匹配。", "原子创建 Work Item、四个 Stage、命令结果和历史事件。"]
  state_transitions: ["none -> draft"]
  side_effects: ["只读调用 Project v1；只写 Design Operations 数据库"]
