# 更新 Project 基础资料 API 契约
# 路径: arckit/tech/_shared/contracts/project-update.yaml

metadata:
  path: "tech/_shared/contracts/project-update.yaml"
  domain: "project-workspace"
  owner: "Project Workspace"
  version: "1.1"
  created: "2026-09-25"
  updated: "2026-10-02"

endpoint:
  method: PUT
  path: "/api/v1/projects/{project_id}"
  summary: "完整替换可编辑 Project 基础资料"
  auth_required: true
  audience: "project-workspace"
  capability: "project-workspace.update"

request:
  path_params:
    - {name: project_id, type: string, format: uuid, required: true}
  body:
    type: object
    additionalProperties: false
    required: [command_id, expected_revision, project_number, name, project_type_keys]
    properties:
      command_id: {type: string, format: uuid}
      expected_revision: {type: integer, minimum: 1}
      project_number: {type: string, minLength: 1, maxLength: 64}
      name: {type: string, minLength: 1, maxLength: 200}
      summary: {type: string, maxLength: 2000, default: ""}
      planned_start_date: {type: [string, "null"], format: date}
      planned_end_date: {type: [string, "null"], format: date}
      project_type_keys:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}

responses:
  success: {status: 200, schema: {$ref: "../models/Project.yaml"}}
  errors:
    - {status: 400, code: INVALID_REQUEST, retryable: false}
    - {status: 401, code: UNAUTHENTICATED, retryable: false}
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 404, code: PROJECT_NOT_FOUND, retryable: false}
    - {status: 409, code: REVISION_CONFLICT, retryable: true}
    - {status: 409, code: PROJECT_NUMBER_CONFLICT, retryable: false}
    - {status: 409, code: PROJECT_CANCELLED, retryable: false}

business_logic:
  flow:
    - "锁定 Project 并消费 expected_revision。"
    - "client_party 不属于基础资料替换；首个切片只允许创建时选择，重选或解除必须等待独立业务语义和验收，不能静默改写历史。"
    - "标准化后无变化的请求返回当前 Project，不产生新 revision。"
    - "有变化时递增 revision 并写 project_details_replaced 事件。"
  state_transitions: ["draft -> draft", "pending_completion -> pending_completion"]
  active_correction: "已立项使用独立 project-profile-correction v1 和 project-workspace.profile.correct；旧 PUT 从未允许 active，不扩大旧凭证权限。"
  side_effects: ["不修改 Assignment、Resource Link 或外部资源"]
