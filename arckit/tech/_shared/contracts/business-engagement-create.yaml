# 创建 Business Engagement API 契约
metadata: {path: "tech/_shared/contracts/business-engagement-create.yaml", domain: "business-engagement", owner: "Business Engagement", version: "1.0", created: "2026-09-27", updated: "2026-09-27"}
endpoint: {method: POST, path: "/api/v1/business-engagements", summary: "为 active Project 创建经营承接记录", auth_required: true, audience: "business-engagement", capability: "business-engagement.create"}
request:
  body:
    type: object
    additionalProperties: false
    required: [command_id, project_id, project_source_revision]
    properties:
      command_id: {type: string, format: uuid}
      project_id: {type: string, format: uuid}
      project_source_revision: {type: integer, minimum: 1}
responses:
  success: {status: 201, schema: {$ref: "../models/BusinessEngagementDetails.yaml"}}
  errors:
    - {status: 401, code: UNAUTHENTICATED, retryable: false}
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 403, code: SCOPE_DENIED, retryable: false}
    - {status: 409, code: PROJECT_ENGAGEMENT_CONFLICT, retryable: false}
    - {status: 409, code: COMMAND_PAYLOAD_CONFLICT, retryable: false}
    - {status: 422, code: REFERENCE_INVALID, retryable: false}
    - {status: 503, code: REFERENCE_SERVICE_UNAVAILABLE, retryable: true}
business_logic:
  flow: ["验证同 tenant、active、revision 匹配的 Project Reference。", "原子创建 revision 1、命令结果和历史事件，不复制 Project 数据。"]
  state_transitions: ["none -> draft"]
