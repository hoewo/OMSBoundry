# Money Receipt Set 最小引用读取 API 契约
metadata: {path: "tech/_shared/contracts/money-receipt-set-reference-get.yaml", domain: "money-flow-ledger", owner: "Money Flow Ledger", version: "1.0", created: "2026-09-28", updated: "2026-09-28"}
endpoint: {method: GET, path: "/api/v1/references/receipt-sets/{receipt_set_id}", summary: "向 Bonus Distribution 提供已确认公司回款集合", auth_required: true, audience: "money-flow-ledger", capability: "money-flow-ledger.receipt-set.reference.read"}
request:
  path_params:
    - {name: receipt_set_id, type: string, format: uuid, required: true}
responses:
  success:
    status: 200
    schema:
      type: object
      additionalProperties: false
      required: [schema_version, source_application, id, tenant_id, resource_type, project_id, status, currency, revision, total_amount_minor, items]
      properties:
        schema_version: {type: string, const: "1"}
        source_application: {type: string, const: money-flow-ledger}
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        resource_type: {type: string, const: receipt-set}
        project_id: {type: string, format: uuid}
        status: {type: string, const: confirmed}
        currency: {type: string, const: CNY}
        revision: {type: integer, minimum: 1}
        total_amount_minor: {type: integer, minimum: 1}
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [transaction_id, transaction_revision, allocation_id, allocation_revision, amount_minor, currency, status]
            properties:
              transaction_id: {type: string, format: uuid}
              transaction_revision: {type: integer, minimum: 1}
              allocation_id: {type: string, format: uuid}
              allocation_revision: {type: integer, minimum: 1}
              amount_minor: {type: integer, minimum: 1}
              currency: {type: string, const: CNY}
              status: {type: string, const: confirmed}
  errors:
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 404, code: RECEIPT_SET_NOT_FOUND, retryable: false}
    - {status: 422, code: RECEIPT_SET_NOT_CONFIRMED, retryable: false}
business_logic:
  flow: ["由 Money Flow 汇总并签出稳定集合，不允许消费方读表重建。", "v1 只接受同一 Tenant、Project 下仍有效且能精确表示为人民币分的 CNY receipt allocation；其他币种后续以兼容契约扩展。", "Transaction 与 Allocation 都是不可变根事实，v1 revision 固定为 1；ID、revision 必须同时冻结，集合总额等于条目金额之和。"]
