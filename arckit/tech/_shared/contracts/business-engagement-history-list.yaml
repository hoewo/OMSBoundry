metadata: {path: "tech/_shared/contracts/business-engagement-history-list.yaml", domain: "business-engagement", owner: "Business Engagement", version: "1.0", created: "2026-09-27", updated: "2026-09-27"}
endpoint: {method: GET, path: "/api/v1/business-engagements/{engagement_id}/history", summary: "读取不可变经营承接历史", auth_required: true, audience: "business-engagement", capability: "business-engagement.history.read"}
request:
