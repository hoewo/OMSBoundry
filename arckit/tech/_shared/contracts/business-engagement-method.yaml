# 选择 Business Engagement 承接方式 API 契约
metadata: {path: "tech/_shared/contracts/business-engagement-method.yaml", domain: "business-engagement", owner: "Business Engagement", version: "1.0", created: "2026-09-27", updated: "2026-09-27"}
endpoint: {method: POST, path: "/api/v1/business-engagements/{engagement_id}/method", summary: "选择承接方式并重算材料缺口", auth_required: true, audience: "business-engagement", capability: "business-engagement.method.select"}
request:
  path_params: [{name: engagement_id, type: string, format: uuid, required: true}]
  body:
    type: object
    additionalProperties: false
    required: [command_id, expected_revision, method]
    properties:
      command_id: {type: string, format: uuid}
      expected_revision: {type: integer, minimum: 1}
      method: {type: string, enum: [comparison, competitive_negotiation, tender]}
responses:
  success: {status: 200, schema: {$ref: "../models/BusinessEngagementDetails.yaml"}}
  errors: [{status: 409, code: REVISION_CONFLICT, retryable: true}, {status: 409, code: ENGAGEMENT_STATE_CONFLICT, retryable: false}]
business_logic: {flow: ["按 material_policy_version=1 映射必需材料。", "方式变化只重算缺口，不物理删除旧材料引用。"]}
