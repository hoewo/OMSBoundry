# 完成 Project 立项 API 契约
# 路径: arckit/tech/_shared/contracts/project-initiation-complete.yaml

metadata:
  path: "tech/_shared/contracts/project-initiation-complete.yaml"
  domain: "project-workspace"
  owner: "Project Workspace"
  version: "1.1"
  created: "2026-09-25"
  updated: "2026-10-02"

endpoint:
  method: POST
  path: "/api/v1/projects/{project_id}/complete-initiation"
  summary: "校验并完成项目立项"
  auth_required: true
  audience: "project-workspace"
  capability: "project-workspace.initiation.complete"

request:
  path_params:
    - {name: project_id, type: string, format: uuid, required: true}
  body:
    type: object
    additionalProperties: false
    required: [command_id, expected_revision]
    properties:
      command_id: {type: string, format: uuid}
      expected_revision: {type: integer, minimum: 1}
      initiation_profile:
        type: string
        enum: [dual-owner-v1, business-owner-v1]
        description: "可选的有界资料门槛；省略保持原双负责人规则与旧命令摘要。不是授权凭证。"

responses:
  success: {status: 200, schema: {$ref: "../models/Project.yaml"}}
  errors:
    - {status: 400, code: INVALID_REQUEST, retryable: false}
    - {status: 401, code: UNAUTHENTICATED, retryable: false}
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 404, code: PROJECT_NOT_FOUND, retryable: false}
    - {status: 409, code: REVISION_CONFLICT, retryable: true}
    - {status: 409, code: PROJECT_STATE_CONFLICT, retryable: false}
    - {status: 409, code: COMMAND_PAYLOAD_CONFLICT, retryable: false}
    - status: 422
      code: INITIATION_INCOMPLETE
      retryable: false
      details:
        type: object
        required: [missing]
        properties:
          missing:
            type: array
            items: {type: string, enum: [project_number, name, project_type, business_owner, production_owner]}

business_logic:
  flow:
    - "校验闭合的 initiation_profile 目录、原生完成能力、tenant／Project Scope 和 revision。"
    - "省略或 dual-owner-v1 要求编号、名称、至少一个类型与两个 active 负责人；business-owner-v1 只要求经营负责人，生产负责人可后补，项目包编号可选。普通项目完成时编号仍必填。"
    - "缺口存在时记录 pending 事件并把状态置为 pending_completion。"
    - "无缺口时递增 revision、进入 active 并写 project_activated 事件。"
    - "显式门槛参与命令摘要并保存到历史；省略时不改变原命令摘要及历史字段。"
  state_transitions: ["draft -> pending_completion", "draft -> active", "pending_completion -> active"]
  side_effects: ["不创建 Contract、Money、Evidence 或设计阶段事实"]
