# 创建 Project API 契约
# 路径: arckit/tech/_shared/contracts/project-create.yaml

metadata:
  path: "tech/_shared/contracts/project-create.yaml"
  domain: "project-workspace"
  owner: "Project Workspace"
  version: "1.1"
  created: "2026-09-25"
  updated: "2026-09-27"

endpoint:
  method: POST
  path: "/api/v1/projects"
  summary: "创建 Project 草稿"
  auth_required: true
  audience: "project-workspace"
  capability: "project-workspace.create"

request:
  body:
    type: object
    additionalProperties: false
    required: [command_id, project_number, name, project_type_keys]
    properties:
      command_id: {type: string, format: uuid}
      project_number: {type: string, minLength: 1, maxLength: 64}
      name: {type: string, minLength: 1, maxLength: 200}
      summary: {type: string, maxLength: 2000, default: ""}
      planned_start_date: {type: [string, "null"], format: date}
      planned_end_date: {type: [string, "null"], format: date}
      project_type_keys:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
      client_party:
        type: [object, "null"]
        additionalProperties: false
        description: "可选客户主体精确引用；显示字段由服务从 Party Directory 获取，调用方不得提交。"
        required: [party_id, source_revision]
        properties:
          party_id: {type: string, format: uuid}
          source_revision: {type: integer, minimum: 1}

responses:
  success:
    status: 201
    schema: {$ref: "../models/Project.yaml"}
  errors:
    - {status: 400, code: INVALID_REQUEST, retryable: false}
    - {status: 401, code: UNAUTHENTICATED, retryable: false}
    - {status: 403, code: CAPABILITY_DENIED, retryable: false}
    - {status: 409, code: PROJECT_NUMBER_CONFLICT, retryable: false}
    - {status: 409, code: COMMAND_PAYLOAD_CONFLICT, retryable: false}
    - {status: 422, code: REFERENCE_INVALID, retryable: false}
    - {status: 503, code: REFERENCE_UNAVAILABLE, retryable: true}

business_logic:
  flow:
    - "标准化编号、名称、日期和类型 key。"
    - "同 tenant 的 command_id 同摘要返回原 Project；不同摘要拒绝。"
    - "存在 client_party 时，先用 Project Workspace 工作负载身份从 Party Directory 读取精确 ID／revision；校验 tenant、active、类型和法定名称后，只冻结最小快照。"
    - "重放检查先于 Party 调用；相同命令在 Party 改名或暂时不可用后仍返回原 Project。"
    - "创建 revision 1 draft Project、命令记录和 project_created 事件。"
  state_transitions: ["none -> draft"]
  side_effects: ["可选只读调用 Party Directory；成功后只写 Project Workspace 数据库，不修改 Party"]
