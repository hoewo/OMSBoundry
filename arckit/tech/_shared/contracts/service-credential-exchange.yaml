# IAM 服务凭证交换契约
metadata: {path: "tech/_shared/contracts/service-credential-exchange.yaml", domain: "identity-access", owner: "Identity & Access", version: "1.0", created: "2026-09-26", updated: "2026-09-26"}
endpoint: {method: POST, path: "/api/v1/service-credentials", summary: "用工作负载断言交换单 action、精确资源的短期 Capability Credential", auth_required: false, audience: "identity-access"}
request:
  body:
    type: object
    additionalProperties: false
    required: [assertion, audience, action, scope]
    properties:
      assertion: {type: string, description: "Ed25519 JWT；最长 60 秒、一次性 jti，并以 request_sha256 绑定其余三个字段。"}
      audience: {type: string, pattern: "^[a-z][a-z0-9-]{2,63}$"}
      action: {type: string, description: "必须属于 audience 命名空间且命中 Workload Policy。"}
      scope: {kind: resources, maximum_resources: 32, description: "只接受精确 Resource Scope，不接受 tenant scope。"}
responses:
  success:
    status: 200
    schema: {type: CapabilityCredential, token_type: Bearer, maximum_ttl_seconds: 60, actions: "exactly one", cache_control: no-store}
  errors:
    - {status: 400, code: invalid_request, retryable: false}
    - {status: 401, code: invalid_workload_assertion, retryable: false}
    - {status: 403, code: service_capability_denied, retryable: false}
    - {status: 409, code: workload_assertion_replayed, retryable: false}
business_logic:
  flow:
    - "IAM 重新读取该 Workload 的 public key bundle，校验 active／retiring key、Tenant、时钟和请求摘要。"
    - "IAM 在 PostgreSQL 一次性消费 assertion jti，并以版本化 Workload Policy 限制 audience/action/resource type。"
    - "成功签发写入 service_identity Actor 的不可变审计；不记录私钥、Assertion 或 Capability Token 原文。"
  invariants:
    - "调用方私钥不进入 IAM；IAM 签名私钥不进入调用方。"
    - "交换只建立机器身份和最小能力，不替代目标应用最终授权。"
    - "IAM 不可用时新交换失败关闭，既有本地业务事实读取不依赖交换成功。"
