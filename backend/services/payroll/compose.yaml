services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll_dev
    ports: ["127.0.0.1:55443:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [payroll-postgres:/var/lib/postgresql]
volumes:
  payroll-postgres:
