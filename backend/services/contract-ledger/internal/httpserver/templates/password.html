<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · Contract Ledger</title>
  <link rel="stylesheet" href="{{.BasePath}}/assets/demo-workbench.css">
</head>
<body>
  <header>
    <a href="{{.BasePath}}/">Contract Ledger</a>
    <h1>修改密码</h1>
    <p>当前用户：{{.Principal.DisplayName}}（{{.Principal.Role}}）</p>
    <nav aria-label="合同台账主导航"><a href="{{.BasePath}}/">首页</a> <a href="{{.BasePath}}/parties">主体</a> <a href="{{.BasePath}}/contracts">合同</a> <a href="{{.BasePath}}/audit">审计</a> {{if .CanRestore}}<a href="{{.BasePath}}/admin/restore">恢复账簿</a>{{end}} {{if .CanManage}}<a href="{{.BasePath}}/admin/users">本地用户</a>{{end}} <a href="{{.BasePath}}/account/password" aria-current="page">修改密码</a></nav>
  </header>
  <main>
    {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="{{.BasePath}}/account/password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="current_password">当前密码</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="72" required>
      <label for="new_password">新密码</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
      <button type="submit">修改密码并注销全部会话</button>
    </form>
  </main>
</body>
</html>
