name: omsbizfoundry-contract-ledger

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: contract_ledger
      POSTGRES_USER: contract_ledger
      POSTGRES_PASSWORD: contract_ledger_dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_ledger -d contract_ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - contract-ledger-db:/var/lib/postgresql

volumes:
  contract-ledger-db:
