services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: evidence_service
      POSTGRES_PASSWORD: evidence_service_dev
      POSTGRES_DB: evidence_service
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_service -d evidence_service"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - evidence-service-postgres:/var/lib/postgresql

volumes:
  evidence-service-postgres:
