services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: people_groups
      POSTGRES_PASSWORD: people_groups_dev
      POSTGRES_DB: people_groups
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people_groups -d people_groups"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - people-groups-postgres:/var/lib/postgresql

volumes:
  people-groups-postgres:
