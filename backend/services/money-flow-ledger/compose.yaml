name: omsbizfoundry-money-flow-ledger

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: money_flow
      POSTGRES_USER: money_flow
      POSTGRES_PASSWORD: money_flow_dev
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_flow -d money_flow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - money-flow-db:/var/lib/postgresql

volumes:
  money-flow-db:
