services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: party_directory
      POSTGRES_USER: party_directory
      POSTGRES_PASSWORD: party_directory_dev
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_directory -d party_directory"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - party-directory-postgres:/var/lib/postgresql
volumes:
  party-directory-postgres:
