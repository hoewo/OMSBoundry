services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: internal_finance_requests
      POSTGRES_USER: internal_finance_requests
      POSTGRES_PASSWORD: internal_finance_requests_dev
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internal_finance_requests -d internal_finance_requests"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [internal-finance-postgres:/var/lib/postgresql]
volumes:
  internal-finance-postgres:
