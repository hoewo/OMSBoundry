services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: design_operations
      POSTGRES_PASSWORD: design_operations_dev
      POSTGRES_DB: design_operations
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U design_operations -d design_operations"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - design-operations-postgres:/var/lib/postgresql

volumes:
  design-operations-postgres:
