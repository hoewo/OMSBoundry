services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: project_workspace
      POSTGRES_PASSWORD: project_workspace_dev
      POSTGRES_DB: project_workspace
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_workspace -d project_workspace"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - project-workspace-postgres:/var/lib/postgresql

volumes:
  project-workspace-postgres:
